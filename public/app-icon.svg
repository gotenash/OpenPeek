<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Lens Outer Ring Gradient -->
    <linearGradient id="lensOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Lens Inner Dark Gradient -->
    <linearGradient id="lensInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Red Recording Dot Glow -->
    <linearGradient id="recGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16"/>
    </filter>
  </defs>

  <!-- App Rounded Base Container -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#glassGrad)"/>

  <!-- Subtle Rim Light Inner Border -->
  <rect x="68" y="68" width="888" height="888" rx="220" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Screen Frame / Camera Aperture Body -->
  <!-- Video Screen Body -->
  <rect x="210" y="270" width="410" height="484" rx="64" fill="url(#lensOuter)" filter="url(#shadow)"/>
  <rect x="236" y="296" width="358" height="432" rx="46" fill="url(#lensInner)"/>

  <!-- Right Trapeze Objective Lens -->
  <path d="M 640,410 L 784,310 C 804,296 824,310 824,334 L 824,690 C 824,714 804,728 784,714 L 640,614 Z" fill="url(#lensOuter)" filter="url(#shadow)"/>
  <path d="M 656,430 L 768,352 C 778,345 792,352 792,364 L 792,660 C 792,672 778,679 768,672 L 656,594 Z" fill="url(#lensInner)"/>

  <!-- Center Glowing Recording Aperture Lens -->
  <circle cx="415" cy="512" r="110" fill="#090d16" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.6"/>
  <circle cx="415" cy="512" r="76" fill="url(#recGlow)" filter="url(#shadow)"/>
  <circle cx="390" cy="488" r="22" fill="#ffffff" fill-opacity="0.5"/>

  <!-- Peek Focus Corner Brackets -->
  <path d="M 270,360 L 270,330 L 300,330" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M 560,330 L 530,330" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M 560,330 L 560,360" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M 270,664 L 270,694 L 300,694" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M 560,694 L 530,694" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M 560,694 L 560,664" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
</svg>
